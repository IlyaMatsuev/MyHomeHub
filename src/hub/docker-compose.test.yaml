version: "3.8"
services:
  mongodb-test:
    image: mongo:7.0.16-jammy
    container_name: mongodb-test
    env_file: .env.test
    restart: always
    ports:
      - "27018:27018"
    networks:
      - smarthome-network

  smarthome-hub-server-test:
    image: ilyamatsuev/smarthome-hub-server
    container_name: smarthome-hub-server-test
    env_file: .env.test
    restart: always
    ports:
      - "3010:3010"
    expose:
      - "3010"
    networks:
      - smarthome-network

networks:
  smarthome-network:
    driver: bridge
