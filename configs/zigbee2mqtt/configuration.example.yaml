version: 5

homeassistant:
  enabled: false

mqtt:
  base_topic: zigbee2mqtt
  server: __MQTT_SERVER_URL__
  user: __Z2M_MQTT_USERNAME__
  password: __Z2M_MQTT_PASSWORD__

# z2m publishes a health report to "zigbee2mqtt/bridge/health" every `interval` minutes.
# The hub watches it to detect a dead bridge.
# Keep it well below ZIGBEE_HEALTH_TIMEOUT_MS (30 min) in src/zigbee/zigbee.constants.ts
health:
  interval: 10

serial:
  adapter: ember
  port: __Z2M_COORDINATOR_URL__

advanced:
  # debug | info | warning | error
  log_level: info
  channel: 15
  network_key: __Z2M_NETWORK_KEY__
  pan_id: __Z2M_PAN_ID__
  ext_pan_id: __Z2M_EXT_PAN_ID__

frontend:
  enabled: true
  port: 8080
