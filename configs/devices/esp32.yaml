fans:
  mqtt:
    controls:
      - label: "On"
        name: "on"
        type: boolean
        description: "Switch on/off state"
        default: true
      - label: "Speed levels"
        name: "speedLevels"
        type: object
        description: "Temperature thresholds the fan speed levels switch at. The structure is validated by the ESP32 fans DTO"
    measurements:
      - label: "Temperature (C)"
        name: "temperature"
        type: number
        description: "Air temperature around the device in Celsius"
      - label: "Fan Speed (%)"
        name: "speedPercentage"
        type: number
        description: "How fast the fans spin based on the temperature level"
        constraints:
          min: 0
          max: 100

lock:
  mqtt:
    commands:
      - label: "Unlock"
        name: "unlock"
        type: boolean
        description: "Unlock the door for the specified amount of time defined in the 'Unlock Timeout' control. After the timeout, the door locks back."
    controls:
      - label: "On"
        name: "on"
        type: boolean
        description: "Switch on/off state"
        default: true
      - label: "Unlock Timeout (ms)"
        name: "unlockTimeout"
        type: number
        description: "Holds the time (in milliseconds) for the door to remain unlocked, when it's open."
        default: 5000
        constraints:
          min: 1000
          max: 30000
          integer: true
    measurements:
      - label: "Is unlocked?"
        name: "unlocked"
        type: boolean
        description: "Signals if the lock is currently unlocked"
        default: false
