led:
  tuya:
    controls:
      - label: "On"
        name: "on"
        type: boolean
        path: "20"
        description: "Switch on/off state"
      - label: "Brightness"
        name: "brightness"
        type: number
        description: "Brightness level 1-100"
        constraints:
          min: 1
          max: 100
          integer: true
      - label: "Light color"
        name: "color"
        type: string
        description: "Light color HEX number"
        constraints:
          format: "hex-color"
