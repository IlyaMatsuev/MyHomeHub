name: Publish Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validation"]
  push:
    branches:
      - main
    paths:
      - "src/hub/src/**"
      - "src/hub/Dockerfile"

env:
  DOCKER_USERNAME: ilyamatsuev
  DOCKER_IMAGE_NAME: smarthome-hub-server

# Secrets required for this action:
# 1. DOCKER_ACCESS_TOKEN - docker personal access token used to log in into the registry

jobs:
  publish-image:
    name: "Publish the latest docker image version"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        run: echo ${{ secrets.DOCKER_ACCESS_TOKEN }} | docker login -u ${{ env.DOCKER_USERNAME }} --password-stdin

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push the image"
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          push: true
          context: src/hub
          tags: "${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}"
