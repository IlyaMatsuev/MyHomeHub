name: Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"

jobs:
  linting:
    name: "Verify source code linting"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v6

      - name: "Restore node_modules cache"
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ env.cache-name }}-
            npm-

      - name: "Install npm dependencies"
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm i

      - name: "Verify formatting"
        run: npm run prettier:verify ./

      - name: "Verify linting"
        run: npm run eslint:verify ./

  testing:
    name: "Run unit tests"
    runs-on: ubuntu-24.04
    needs: linting
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v6

      - name: "Restore node_modules cache"
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ env.cache-name }}-
            npm-

      - name: "Install npm dependencies"
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm i

      - name: "Run tests"
        run: npm test -- --forceExit
