name: Publish Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validation"]
    types:
      - completed
    branches:
      - main

env:
  DOCKER_USERNAME: ilyamatsuev
  DOCKER_IMAGE_NAME: smarthome-hub-server
  REGISTRY_IMAGE: ilyamatsuev/smarthome-hub-server

# Secrets required for this action:
# 1. DOCKER_ACCESS_TOKEN - docker personal access token used to log in into the registry

jobs:
  build-amd64:
    name: "Build amd64 image"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push by digest"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

  build-arm64:
    name: "Build arm64 image"
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push by digest"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max,scope=linux/arm64

  publish-image:
    name: "Publish multi-arch image"
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64
    steps:
      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Create and push manifest"
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}@${{ needs.build-amd64.outputs.digest }} \
            ${{ env.REGISTRY_IMAGE }}@${{ needs.build-arm64.outputs.digest }}
